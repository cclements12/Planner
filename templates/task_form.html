<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading }}</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/styles.css') }}">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 6px; }
    legend { font-weight: 600; padding: 0 .4rem; }
    label { display: block; margin-top: .75rem; font-size: .9rem; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: .45rem; margin-top: .25rem; font: inherit; }
    input[type="checkbox"] { width: auto; margin-right: .4rem; }
    .row { display: flex; gap: 1rem; }
    .row > label { flex: 1; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; font: inherit; cursor: pointer; }
    small { color: #666; }
  </style>
</head>
<body>

  <h1>{{ heading }}</h1>
  <p><a href="{{ url_for('main_page') }}">&larr; Back to task list</a></p>

  {% with messages = get_flashed_messages() %}
    {% for message in messages %}
      <p class="flash">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  <!-- One form for both creating and editing. id and created_at are generated by SQLite, so they are not in the form. -->
  <form action="{{ form_action }}" method="post">
    <fieldset>
      <legend>Task</legend>

      <label>Task name
        <input type="text" name="task_name" value="{{ task.get('task_name', '') }}" required>
      </label>

      <div class="row">
        <label>Group ID
          <input type="text" name="group_id" value="{{ task.get('group_id', '') }}" required>
        </label>
        <label>Status
          <input type="text" name="task_status" list="status-options" value="{{ task.get('task_status', '') }}" required>
          <datalist id="status-options">
            <option value="Not Started">
            <option value="In Progress">
            <option value="Done">
          </datalist>
        </label>
      </div>

      <label>Description
        <textarea name="task_description" rows="3" required>{{ task.get('task_description', '') }}</textarea>
      </label>

      <label>Notes
        <textarea name="task_notes" rows="3" required>{{ task.get('task_notes', '') }}</textarea>
      </label>

      <label>Assigned user (primary assignee)
        <input type="text" name="task_assigned_user" value="{{ task.get('task_assigned_user', '') }}" required>
      </label>

      <label>Additional users on card <small>(optional, comma-separated usernames, saved to task_users)</small>
        <input type="text" name="task_users" value="{{ extra_users }}" placeholder="alice, bob">
      </label>

      {% set priority_options = ['Low', 'Medium', 'High'] %}
      {% set saved_priority = task.get('task_priority', '') %}
      <div class="row">
        <label>Priority (text)
          <select name="task_priority" required>
            <option value="" disabled {{ 'selected' if not saved_priority }}>Choose...</option>
            {% for option in priority_options %}
              <option {{ 'selected' if saved_priority == option }}>{{ option }}</option>
            {% endfor %}
            {% if saved_priority and saved_priority not in priority_options %}
              <option selected>{{ saved_priority }}</option>
            {% endif %}
          </select>
        </label>
        <label>Priority (number)
          <input type="number" name="priority" value="{{ task.get('priority', 1) }}" step="1">
        </label>
      </div>

      <div class="row">
        <label>Start date <small>(optional)</small>
          <input type="date" name="start_date" value="{{ task.get('start_date') or '' }}">
        </label>
        <label>Due date <small>(optional)</small>
          <input type="date" name="due_date" value="{{ task.get('due_date') or '' }}">
        </label>
      </div>

      <label>
        <input type="checkbox" name="completed" value="1" {{ 'checked' if task.get('completed') }}> Completed
      </label>

      <button type="submit">{{ 'Save changes' if task.get('id') else 'Save task' }}</button>
    </fieldset>
  </form>

  <!-- Project members (proposed project_members table; added_at is generated by SQLite) -->
  <form action="{{ url_for('add_project_member') }}" method="post">
    <fieldset>
      <legend>Add project member</legend>

      <div class="row">
        <label>Group ID
          <input type="text" name="group_id" value="{{ task.get('group_id', '') }}" required>
        </label>
        <label>Username
          <input type="text" name="username" required>
        </label>
      </div>

      <label>Role
        <input type="text" name="role" value="member" required>
      </label>

      <button type="submit">Add member</button>
    </fieldset>
  </form>

</body>
</html>
